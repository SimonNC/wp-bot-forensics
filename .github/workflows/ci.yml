name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: site.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke run on the versioned sample (no Elasticsearch)
        run: |
          if [ -d data/sample/apache ]; then
            python -m botforensics ingest data/sample --no-es --out "$RUNNER_TEMP/processed"
          fi
